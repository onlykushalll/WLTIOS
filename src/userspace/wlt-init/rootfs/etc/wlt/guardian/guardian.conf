# /etc/wlt/guardian/guardian.conf — Guardian daemon configuration
# All paths are absolute so guardian works regardless of cwd.
# Without this file, guardian falls back to defaults which include
# relative paths (signatures/fim.db) that fail when cwd != build dir.

sigs_path = /etc/wlt/guardian/sigs/guardian.yarc
fim_db_path = /etc/wlt/guardian/fim.db
bpf_dir = /etc/wlt/guardian/bpf/
ml_model_path = /etc/wlt/guardian/anomaly.pkl
log_path = /var/log/guardian.log
socket_path = /var/run/guardian.sock
policy_path = /etc/wlt/guardian/guardian.policy
