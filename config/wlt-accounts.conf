[wlt-settings]
# User account settings panel
# This file is loaded by WLT-Settings accounts_panel.c (to be written)

[account]
username = default
full_name = WLTIOS User
shell = /usr/bin/wlt-shell
home = /users/default
uid = 1000
gid = 1000

[security]
auto_login = no
screen_lock_timeout = 300
require_password = yes
guest_mode = no

[session]
desktop = wlt-compositor
window_manager = wlt-compositor
