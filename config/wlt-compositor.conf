[wlt-compositor]
backend = drm
renderer = gles2
xwayland = yes

[outputs]
mode = auto
scale = 1

[keybindings]
launcher = Super+d
terminal = Super+t
file_manager = Super+e
close = Super+Shift+q
exit = Super+Shift+e

[theme]
background = #1a1b26
border_color = #7aa2f7
border_width = 2
shadow = yes
corner_radius = 8
